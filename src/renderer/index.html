<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>TikTok Live Chat Overlay</title>
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/layout.css">
</head>
<body>
<main class="panel">

  <!-- Titlebar -->
  <header class="titlebar">
    <div class="brand">
      <i class="live-dot"></i>
      <b>LIVE</b>
      <span id="duration">00:00:00</span>
    </div>
    <div class="header-stats">
      <button type="button" class="stat viewers" id="viewers-btn" title="Top viewers">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
        <b id="viewers">—</b>
      </button>
      <button type="button" class="stat likes" id="likes-btn" title="Top likes">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
        </svg>
        <b id="likes">0</b>
      </button>
    </div>
    <div class="window-actions">
      <button id="min" title="Minimize">—</button>
      <button id="close" title="Close">×</button>
    </div>
  </header>

  <!-- Connect bar -->
  <section id="connect-bar" class="connect-bar">
    <form id="form">
      <div class="input">
        <span class="prefix">@</span>
        <input id="username" placeholder="username or LIVE link" required autocomplete="off">
        <button id="connect" type="submit">Connect</button>
      </div>
      <p id="error"></p>
    </form>
  </section>

  <!-- Status pill -->
  <div id="status-pill" class="status-pill" hidden>
    <i></i>
    <span>Not connected</span>
  </div>

  <!-- Gift section -->
  <section class="gift-section" id="gift-section" hidden>
    <header class="gift-head">
      <span class="gift-icon">🎁</span>
      <span class="gift-title">Gifts</span>
      <span class="gift-count" id="count-gift">0</span>
    </header>
    <div class="gift-feed" id="feed-gift"></div>
  </section>

  <!-- Chat feed -->
  <section class="chat-wrap">
    <header class="chat-head">
      <span class="chat-icon">💬</span>
      <span class="chat-title">Chat</span>
      <span class="chat-count" id="count-chat">0</span>
    </header>
    <div id="feed" class="feed">
      <div id="empty" class="empty">
        <div class="empty-icon">💬</div>
        <p>Waiting for comments…</p>
        <small>Connect to a LIVE</small>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    <div class="footer-left">
      <button id="gear" title="Settings" class="icon-btn">⚙</button>
      <button id="disconnect" title="Disconnect" class="icon-btn" hidden>⏻</button>
    </div>
    <span id="count">0 items</span>
    <span class="resize-help">↘</span>
  </footer>

  <!-- Top viewers popup -->
  <div id="top-popup" class="top-popup" hidden>
    <header class="top-popup-head">
      <span class="top-popup-icon">🏆</span>
      <span class="top-popup-title">Top Viewers</span>
      <button id="top-popup-close" class="top-popup-close" title="Close">×</button>
    </header>
    <div class="top-popup-body" id="top-popup-list">
      <div class="top-popup-empty">No top viewers yet</div>
    </div>
  </div>

  <!-- Top likes popup -->
  <div id="likes-popup" class="top-popup likes-popup" hidden>
    <header class="top-popup-head likes-head">
      <span class="top-popup-icon likes-icon">❤️</span>
      <span class="top-popup-title likes-title">Top Likes</span>
      <button id="likes-popup-close" class="top-popup-close" title="Close">×</button>
    </header>
    <div class="top-popup-body" id="likes-popup-list">
      <div class="top-popup-empty">No likes yet</div>
    </div>
  </div>

  <div id="top-popup-backdrop" class="top-popup-backdrop" hidden></div>
  <div id="likes-popup-backdrop" class="top-popup-backdrop" hidden></div>

</main>
<script src="index.js"></script>
</body>
</html>
